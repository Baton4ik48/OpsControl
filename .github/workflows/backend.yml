name: Backend CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_b
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t ppm-backend ./backend

      - name: Run backend
        run: |
          docker run -d \
            -p 8000:8000 \
            -e DB_CREDS_MODE=static \
            -e POSTGRES_HOST=host.docker.internal \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=testdb \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            ppm-backend

          sleep 5

      - name: Check API
        run: curl -f http://localhost:8000/api/status