stages:
  - test
  #- build
  #- deploy

test-job:
  stage: test
  tags:
    - docker
  image: localhost:5050/root/opscontrol/ci-image:latest

  services:
    - name: postgres:15
      alias: postgres
    - name: hashicorp/vault:1.15
      alias: vault
      command: ["vault", "server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]

  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ppm_database
    POSTGRES_USER: login_ppm
    POSTGRES_PASSWORD: $PG_SECRET
    
    VAULT_ADDR: http://vault:8200
    VAULT_TOKEN: root
    VAULT_DATABASE_ROLE_NAME: postgres-dynamic
    VAULT_ADMIN_PASSWORD: admin
    
  script:
    # Ждём Postgres
    - echo "Ждём postgres..."
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - python backend/scripts/connect-pg-test.py

    - echo "Применяем init.sql..."
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f backend/scripts/init.sql

    # Ждём Vault
    - echo "Ждём vault..."
    - until curl -s -o /dev/null -w "%{http_code}" http://vault:8200/v1/sys/health | grep -q "200"; do sleep 1; done

    # Резолвим IP postgres для Vault
    - export POSTGRES_IP=$(getent hosts postgres | awk '{print $1}')
    - echo "Postgres IP = $POSTGRES_IP"

    # Запуск скрипта Vault
    - sh backend/scripts/vault-init-dev.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'