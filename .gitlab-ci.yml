# ============================================
# Переменные уровня pipeline (общие для всех job)
# ============================================
variables:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ppm_database
  POSTGRES_USER: login_ppm
  POSTGRES_PASSWORD: $PG_SECRET
  
  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN: root
  VAULT_DATABASE_ROLE_NAME: postgres-dynamic
  VAULT_ADMIN_PASSWORD: admin

  IMAGE: $CI_REGISTRY_IMAGE/app
  TAG: $CI_COMMIT_SHA

stages:
  - Build_image 
  - Test_1
  - Test_2
# ============================================
# Stage 0: Build Images
# ============================================
build_images_job:
  stage: Build_image
  tags:
    - docker
  image: docker:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD localhost:5050
  script:
    - echo $CI_REGISTRY
    - echo $CI_REGISTRY_IMAGE
    - docker build -t localhost:5050/root/opscontro/lint-image:$CI_COMMIT_SHA -f docker_images/Dockerfile-lint .
    - docker build -t localhost:5050/root/opscontrol/unit-image:$CI_COMMIT_SHA -f docker_images/Dockerfile-unit .
    - docker build -t localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA -f docker_images/Dockerfile-ci .
    - docker push localhost:5050/root/opscontrol/lint-image:$CI_COMMIT_SHA
    - docker push localhost:5050/root/opscontrol/unit-image:$CI_COMMIT_SHA
    - docker push localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA


# ============================================
# Stage 1: Lint & Unit Tests
# ============================================
lint_job:
  stage: Test_1
  tags:
  - docker
  needs: ["build_images_job"]
  image: localhost:5050/root/opscontrol/lint-image:$CI_COMMIT_SHA
  timeout: 2 minutes
  script:
    - ruff check backend/
    - black --check backend/

unit_tests_job:
  stage: Test_1
  tags:
  - docker
  needs: ["build_images_job"]
  image: localhost:5050/root/opscontrol/unit-image:$CI_COMMIT_SHA
  timeout: 2 minutes
  script:
  - PYTHONPATH=backend pytest backend/

# ============================================
# Stage 2: Integration Tests
# ============================================
integration-job:
  stage: Test_2
  tags:
    - docker
  needs: ["build_images_job"]
  image: localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA
  timeout: 2 minutes

  services:
    - name: postgres:15
      alias: postgres
    - name: hashicorp/vault:1.15
      alias: vault
      command: ["vault", "server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]

  script:
    # Ждём Postgres
    - echo "Ждём postgres..."
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - python backend/scripts/connect-pg-test.py

    - echo "Применяем init.sql..."
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f backend/scripts/init.sql

    # Ждём Vault
    - echo "Ждём vault..."
    - until curl -s -o /dev/null -w "%{http_code}" http://vault:8200/v1/sys/health | grep -q "200"; do sleep 1; done

    # Резолвим IP postgres для Vault
    - export POSTGRES_IP=$(getent hosts postgres | awk '{print $1}')
    - echo "Postgres IP = $POSTGRES_IP"

    # Запуск скрипта Vault
    - sh backend/scripts/vault-init-dev.sh