# ============================================
# Переменные уровня pipeline (общие для всех job)
# ============================================
variables:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ppm_database
  POSTGRES_USER: $PG_USER
  POSTGRES_PASSWORD: $PG_SECRET

  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN: root
  VAULT_DATABASE_ROLE_NAME: postgres-dynamic
  VAULT_ADMIN_PASSWORD: $VAULT_ADMIN_PASSWORD_SECRET

  VAULT_ROLE_ID: $VAULT_ROLE
  VAULT_SECRET_ID: $VAULT_SECRET
  DB_CREDS_MODE: static

.default_docker:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD localhost:5050

.skip_on_tag:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

.verify_base:
  stage: verify
  tags: [docker]
  image: localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA
  timeout: 5 minutes
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  services:
    - name: postgres:15
      alias: postgres
    - name: hashicorp/vault:1.15
      alias: vault
      command: ["vault","server","-dev","-dev-root-token-id=root","-dev-listen-address=0.0.0.0:8200"]
    - name: localhost:5050/root/opscontrol/backend-image:$CI_COMMIT_SHA
      alias: backend
  variables:
    VAULT_ROLE_ID: ci-backend-role-id
    VAULT_SECRET_ID: ci-backend-secret-id
  before_script:
    - echo "Ждём postgres..."
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - echo "Применяем init.sql..."
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f backend/scripts/init.sql
    - echo "Ждём vault..."
    - until curl -s -o /dev/null -w "%{http_code}" http://vault:8200/v1/sys/health | grep -q "200"; do sleep 1; done
    - export POSTGRES_IP=$(getent hosts postgres | awk '{print $1}')
    - sh backend/scripts/vault-init-dev.sh
    - until curl -s http://backend:8000/api/status; do sleep 1; done

stages:
  - prepare
  - test
  - build
  - security_scan
  - verify
  - report
  - deploy
  - package

# ============================================
# Stage 0: Build Images 
# ============================================
prepare_job:
  stage: prepare
  tags: [docker]
  image: docker:29.4.1
  extends: [.default_docker, .skip_on_tag]
  script:
    - docker build -t localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA -f backend/Dockerfile-ci backend/
    - docker push localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA

# ============================================
# Stage 1: Lint & Unit Tests
# ============================================
lint_job:
  stage: test
  tags: [docker]
  image: localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA
  timeout: 2 minutes
  extends: .skip_on_tag
  script:
    - ruff check backend/
    - black --check backend/

unit_job:
  stage: test
  tags:
    - docker
  image: localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA
  timeout: 2 minutes
  extends: .skip_on_tag
  script:
    - export LOG_DIR="$CI_PROJECT_DIR/backend/logs"
    - mkdir -p "$LOG_DIR"
    - export COVERAGE_FILE=.coverage.unit
    - PYTHONPATH=backend pytest backend/tests/unit/ --cov=backend --cov-report=term --cov-report= --cov-config=.coveragerc --junitxml=report-unit.xml

  artifacts:
    paths:
      - .coverage.unit
    reports:
      junit: report-unit.xml

# ============================================
# Stage 2: Build Image Backend 
# ============================================
build_job:
  stage: build
  tags: [docker]
  image: docker:29.4.1
  extends: [.default_docker, .skip_on_tag]
  script:
    - docker build --pull -t localhost:5050/root/opscontrol/backend-image:$CI_COMMIT_SHA -f backend/Dockerfile backend/
    - docker push localhost:5050/root/opscontrol/backend-image:$CI_COMMIT_SHA

# ============================================
# Stage 3: Security Scan
# ============================================
scan_image:
  stage: security_scan
  tags: [docker]
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  dependencies: []
  extends: .skip_on_tag
  variables:
    IMAGE: localhost:5050/root/opscontrol/backend-image:$CI_COMMIT_SHA
    TRIVY_CACHE_DIR: .trivycache/
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
    TRIVY_DISABLE_VEX_NOTICE: "true"
  cache:
    key: trivy-db
    paths: [.trivycache/]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress "$IMAGE"
    - trivy image --format template --template "@/contrib/gitlab.tpl"
      --scanners vuln --skip-db-update --no-progress
      -o gl-container-scanning-report.json "$IMAGE"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      --scanners vuln --skip-db-update --no-progress "$IMAGE"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json

# ============================================
# Stage 4: integration-e2e Tests
# ============================================
integration_job:
  extends: .verify_base
  script:
    - export LOG_DIR="$CI_PROJECT_DIR/backend/logs"
    - mkdir -p "$LOG_DIR"
    - export COVERAGE_FILE=.coverage.integration
    - PYTHONPATH=backend pytest backend/tests/integ/ --cov=backend --cov-report=term --cov-report= --cov-config=.coveragerc --junitxml=report-integration.xml
  artifacts:
    paths:
      - .coverage.integration
    reports:
      junit: report-integration.xml

e2e_job:
  extends: .verify_base
  script:
    - pytest backend/tests/e2e/ -m e2e --junitxml=report-e2e.xml
  artifacts:
    reports:
      junit: report-e2e.xml

# -------------------------
# MERGE COVERAGE
# -------------------------
report_job:
  stage: report
  image: localhost:5050/root/opscontrol/ci-image:$CI_COMMIT_SHA
  tags: [docker]
  extends: .skip_on_tag
  script:
    - coverage combine
    - coverage xml -o coverage.xml
    - coverage report

  coverage: '/TOTAL.*\s+(\d+%)$/'

  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ============================================
# Stage 5: Deploy
# ============================================
deploy_staging_job:
  stage: deploy
  image: docker:29.4.1
  tags: [docker]
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
    - when: never
  manual_confirmation: "Задеплоить staging?"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD localhost:5050
    - docker pull localhost:5050/root/opscontrol/backend-image:$CI_COMMIT_SHA
    - docker rm -f opscontrol-backend-staging || true
    - |
      docker run -d \
        --name opscontrol-backend-staging \
        --restart always \
        --network opscontrol-staging_default \
        --env-file "$STAGING_ENV_FILE" \
        -p 9001:8000 \
        localhost:5050/root/opscontrol/backend-image:$CI_COMMIT_SHA
    - docker network inspect metrics-net >/dev/null 2>&1 || docker network create metrics-net
    - docker network connect metrics-net opscontrol-backend-staging
    - |
      docker image inspect curlimages/curl:8.7.1 >/dev/null 2>&1 || docker pull curlimages/curl:8.7.1
      for i in $(seq 1 20); do
        if docker run --rm --network opscontrol-staging_default curlimages/curl:8.7.1 \
          -fsS http://opscontrol-backend-staging:8000/api/status; then
          exit 0
        fi
        sleep 2
      done
      echo "Backend did not become healthy"
      docker logs opscontrol-backend-staging
      exit 1

deploy_prod_job:
  stage: deploy
  image: docker:29.4.1
  tags: [docker]
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - echo "Здесь могла бы быть ваша реклама :)"

# ============================================
# Stage 6: офлайн-пакет для закрытого контура
# ============================================
package_job:
  stage: package
  image: alpine:3.20
  tags: [docker]
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  before_script:
    - apk add --no-cache skopeo git jq
  script:
    - PKG_NAME="opscontrol-${CI_COMMIT_TAG}"
    - REGISTRY_HOST="172.17.0.1:5050"
    - IMAGE_REPO="${REGISTRY_HOST}/root/opscontrol/backend-image"
    - git bundle create "${PKG_NAME}.bundle" --all
    - git bundle verify "${PKG_NAME}.bundle"
    - git bundle list-heads "${PKG_NAME}.bundle"
    - skopeo login --tls-verify=false -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY_HOST"
    - skopeo copy --src-tls-verify=false --dest-tls-verify=false "docker://${IMAGE_REPO}:${CI_COMMIT_SHA}" "docker://${IMAGE_REPO}:${CI_COMMIT_TAG}"
    - DIGEST=$(skopeo inspect --tls-verify=false "docker://${IMAGE_REPO}:${CI_COMMIT_TAG}" --format '{{.Digest}}')
    - skopeo copy --preserve-digests --src-tls-verify=false "docker://${IMAGE_REPO}@${DIGEST}" "dir:images/backend"
    - ARCHIVE_DIGEST=$(skopeo inspect "dir:images/backend" --format '{{.Digest}}')
    - |
      if [ "$ARCHIVE_DIGEST" != "$DIGEST" ]; then
        echo "Digest разошёлся при копировании в dir: было $DIGEST, стало $ARCHIVE_DIGEST"
        echo "Сквозной digest не работает — нужно возвращаться к варианту с docker-archive и справочным digest."
        exit 1
      fi
    - sh scripts/build_manifest.sh "$CI_COMMIT_TAG" "$CI_COMMIT_SHA" "$IMAGE_REPO" "$DIGEST" "${PKG_NAME}.bundle" > manifest.json
    - tar -czf "${PKG_NAME}.tar.gz" manifest.json "${PKG_NAME}.bundle" images/backend
    - sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
  artifacts:
    paths:
      - opscontrol-${CI_COMMIT_TAG}.tar.gz
      - opscontrol-${CI_COMMIT_TAG}.tar.gz.sha256
    expire_in: never

