# ============================================
# Переменные уровня pipeline (общие для всех job)
# ============================================
variables:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ppm_database
  POSTGRES_USER: login_ppm
  POSTGRES_PASSWORD: $PG_SECRET

  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN: root
  VAULT_DATABASE_ROLE_NAME: postgres-dynamic
  VAULT_ADMIN_PASSWORD: admin

stages:
  - Build_image
  - Test_1
  - Test_2

# -------------------------
# UNIT
# -------------------------
unit_tests_job:
  stage: Test_1
  tags: [docker]
  image: localhost:5050/root/opscontrol/unit-image:latest
  timeout: 2 minutes

  script:
    - PYTHONPATH=backend pytest backend/scripts/tests/unit-testings/ \
        --cov=backend \
        --cov-report=term \
        --cov-report= \
        --cov-config=.coveragerc

  artifacts:
    paths:
      - .coverage

# -------------------------
# INTEGRATION
# -------------------------
integration-job:
  stage: Test_2
  tags: [docker]
  image: localhost:5050/root/opscontrol/int-image:latest
  timeout: 5 minutes

  services:
    - name: postgres:15
      alias: postgres
    - name: hashicorp/vault:1.15
      alias: vault
      command: ["vault","server","-dev","-dev-root-token-id=root","-dev-listen-address=0.0.0.0:8200"]

  script:
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f backend/scripts/init.sql

    - until curl -s -o /dev/null -w "%{http_code}" http://vault:8200/v1/sys/health | grep -q "200"; do sleep 1; done

    - export POSTGRES_IP=$(getent hosts postgres | awk '{print $1}')
    - sh backend/scripts/vault-init-dev.sh
    - export $(cat /tmp/vault_creds.env | xargs)

    - PYTHONPATH=backend DB_CREDS_MODE=static pytest backend/scripts/tests/integ-testings/ \
        --cov=backend \
        --cov-report= \
        --cov-config=.coveragerc

  artifacts:
    paths:
      - .coverage

# -------------------------
# MERGE COVERAGE
# -------------------------
coverage_merge:
  stage: Test_2
  image: python:3.11

  needs:
    - unit_tests_job
    - integration-job

  script:
    - pip install coverage
    - coverage combine
    - coverage xml -o coverage.xml
    - coverage report

  coverage: '/TOTAL.*\s+(\d+%)$/'

  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml