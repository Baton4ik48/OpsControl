# ============================================
# Stage 1: Validate
# ============================================
Validate_job:
  stage: Test_1
  tags:
  - docker
  image: localhost:5050/root/opscontrol/lint-image:v1
  timeout: 2 minutes
  script:
    - ruff check backend/
    - black --check backend/

Validate_job:
  stage: Test_1
  tags:
  - docker
  image: localhost:5050/root/opscontrol/unit-image:v1.2
  timeout: 2 minutes
  script:
  - PYTHONPATH=backend pytest backend/

