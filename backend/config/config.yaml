app:
  name: port-pass-manager-backend
  log_level: INFO

security:
  allowed_networks:
    # TODO: заменить на реальный whitelist после добавления nginx
    - 0.0.0.0/0

  # Доверенные прокси — nginx должен выставлять: proxy_set_header X-Real-IP $remote_addr;
  trusted_proxies:
    - 172.23.0.10  # nginx-staging (fixed IP, see docker-compose-staging.yml)

  login_throttle:
    enabled: true
    max_attempts: 5
    block_seconds: 600
