worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Hide nginx version from responses
    server_tokens off;

    # Log real client IPs (not the proxy chain)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend:8000;

            # -------------------------------------------------------
            # CRITICAL: set X-Real-IP to the actual TCP client address.
            # $remote_addr is the IP nginx connected from — it cannot
            # be spoofed by the client.  The backend trusts this header
            # only when the request arrives from a known proxy IP.
            # -------------------------------------------------------
            proxy_set_header X-Real-IP        $remote_addr;

            # Append client IP to the forwarding chain (informational only —
            # backend does NOT use X-Forwarded-For for access decisions).
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Host             $host;

            # Do NOT forward client-supplied X-Real-IP — override it always.
            # (nginx proxy_set_header already overwrites the header, but this
            # comment exists to make the intent explicit.)

            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
