worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Скрываем версию nginx из ответов
    server_tokens off;

    # Логируем реальные IP клиентов (не цепочку прокси)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend:8000;

            # X-Real-IP выставляется в реальный TCP-адрес клиента ($remote_addr).
            # $remote_addr — IP с которого пришло соединение, клиент его подделать не может.
            # Бэкенд доверяет этому заголовку только если запрос пришёл от известного прокси.
            proxy_set_header X-Real-IP        $remote_addr;

            # Передаём IP в цепочке (только информационно — бэкенд X-Forwarded-For не использует).
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Host             $host;

            # X-Real-IP от клиента не пробрасывается — proxy_set_header выше всегда перезаписывает его.

            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
